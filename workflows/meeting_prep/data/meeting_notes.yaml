Synergy CRM:
  - date: "2026-03-28"
    type: Emergency Issue Review
    attendees:
      - Marcus Reid – COO, Hartwell & Partners
      - Linda Park – IT Director, Hartwell & Partners
      - Claire Nguyen – Account Director, Plenitude
      - Raj Mehta – Solutions Architect, Plenitude
    key_points:
      - Data sync failures causing CRM records to be 24–48 hours out of date for sales team.
      - Root cause identified as rate-limiting conflict between CRM API and middleware polling interval.
      - Sales Director reported lost deal attributed to stale contact data. Executive visibility raised.
      - Interim workaround (manual export) agreed but described as unsustainable by Linda Park.
    action_items:
      - "Raj Mehta: Deploy polling interval fix to staging by 31 Mar; production by 2 Apr"
      - "Claire Nguyen: Provide daily status updates to Marcus until issue resolved"
      - "Hartwell & Partners: Confirm go-ahead for emergency change window"
    decisions:
      - Emergency change window approved for Saturday 1 April, 02:00–06:00.
      - Plenitude to provide on-call cover for 48 hours post-fix.
      - Formal post-incident review scheduled for 10 April.

  - date: "2026-02-12"
    type: Phase 2 Scoping Session
    attendees:
      - Linda Park – IT Director, Hartwell & Partners
      - Claire Nguyen – Account Director, Plenitude
      - Raj Mehta – Solutions Architect, Plenitude
    key_points:
      - Phase 2 requirements gathered: pipeline automation, role-based dashboards, and email integration.
      - Linda flagged that budget for Phase 2 has not yet been approved by the board; decision expected April board meeting.
      - Technical spike agreed to assess email integration complexity before formal scoping.
    action_items:
      - "Raj Mehta: Complete email integration spike and share findings by 28 Feb"
      - "Linda Park: Confirm board budget decision timeline"
    decisions:
      - Phase 2 scoping put on hold pending budget approval.
      - Email integration assessed as medium complexity; no blockers identified.

Nexus Security Review:
  - date: "2026-04-22"
    type: Final Findings Walkthrough
    attendees:
      - Daniel Chen – CISO, Quantum Financial
      - Rachel Torres – Security Operations Lead, Quantum Financial
      - Imogen Walsh – Lead Consultant, Plenitude
      - Stefan Brandt – Penetration Test Lead, Plenitude
    key_points:
      - All 14 in-scope systems reviewed; full penetration test completed across external and internal attack surfaces.
      - Three findings identified: two low severity, one informational. Zero critical or high findings.
      - Daniel confirmed this is the cleanest external audit result the organisation has received in five years.
      - Remediation plan agreed for the two low-severity findings; no immediate action required for informational item.
    action_items:
      - "Rachel Torres: Implement low-severity finding remediations by 16 May"
      - "Imogen Walsh: Issue final report and executive summary by 30 Apr"
    decisions:
      - Final report to be shared with board audit committee by 6 May.
      - Plenitude to be invited to present findings at board meeting if requested.

  - date: "2026-03-18"
