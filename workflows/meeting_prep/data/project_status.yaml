Synergy CRM:
  client: Hartwell & Partners
  programme: Synergy CRM Implementation
  overall_rag: Red
  last_updated: "2026-04-30"
  summary: >
    The programme has experienced a significant production incident (data sync failures causing
    24–48 hour data staleness for the sales team). Root cause was a rate-limiting conflict between
    the CRM API and middleware polling interval. Emergency fix deployed 2 April. System has been
    stable for 28 days but user trust has been damaged. Phase 2 budget approval is still pending
    board sign-off. Executive confidence is low. Recovery of stakeholder relationship is the
    primary priority for the near term.
  milestones:
    - name: Phase 1 go-live
      status: Complete
      date: "2026-02-01"
    - name: Emergency fix – polling interval and rate-limit resilience
      status: Complete
      date: "2026-04-02"
    - name: Post-incident review
      status: Complete
      date: "2026-04-10"
    - name: Phase 2 scoping and budget approval
      status: Blocked
      depends_on: Board budget decision (expected board meeting not yet confirmed)
    - name: Phase 2 kick-off
      status: On hold
  financials:
    contract_value: "£310,000"
    invoiced_to_date: "£195,000"
    outstanding_change_requests: 1
    cr_value_pending: "£12,000"
    notes: Change request covers emergency fix out-of-scope work; client has not yet approved.
